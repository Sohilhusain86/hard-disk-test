<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آڈیو پلیئر & لوپر</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
    .player-card { background: #1e293b; padding: 25px; border-radius: 18px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #334155; }
    h2 { color: #38bdf8; font-size: 20px; margin-top: 0; }
    #trackTitle { color: #00ffa3; font-size: 17px; font-weight: bold; margin-bottom: 12px; word-break: break-word; }
    #engineStatus { font-size: 13px; color: #fbbf24; margin-bottom: 15px; background: #0f172a; padding: 8px; border-radius: 8px; }
    audio { width: 100%; border-radius: 10px; margin-bottom: 10px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
    button { background: #0284c7; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
    button.active { background: #16a34a; border: 1px solid #4ade80; }
    button.danger { background: #dc2626; }
    #statusBox { margin-top: 15px; padding: 10px; background: #0f172a; border-radius: 8px; color: #cbd5e1; font-size: 13px; }
  </style>
</head>
<body>
  <div class="player-card">
    <h2>🎧 فل سکرین آڈیو پلیئر & لوپر</h2>
    <div id="trackTitle">لوڈ ہو رہا ہے...</div>
    <div id="engineStatus">⏳ آڈیو کو میموری (RAM) میں لوڈ کیا جا رہا ہے...</div>

    <audio id="mainAudio" controls autoplay playsinline loop></audio>

    <div class="controls">
      <button id="loopBtn" class="active" onclick="toggleLoop()">🔁 لوپ: چالو (ON)</button>
      <button onclick="changeSpeed()">⚡ سپیڈ: <span id="spdTxt">1x</span></button>
      <button onclick="setSleep(15)">⏱️ 15 منٹ</button>
      <button onclick="setSleep(30)">⏱️ 30 منٹ</button>
      <button class="danger" onclick="setSleep(0)">❌ ٹائمر بند</button>
      <button onclick="history.back()" style="background:#475569;">🔙 واپس جائیں</button>
    </div>

    <div id="statusBox">سلپ ٹائمر: بند ہے</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawUrl = params.get('url') || '';
    const title = params.get('title') || 'نعت شریف';
    document.getElementById('trackTitle').innerText = title;

    const audio = document.getElementById('mainAudio');
    const engineStatus = document.getElementById('engineStatus');
    let isLooping = true;
    audio.loop = true;

    async function initAdvancedAudio() {
      if (!rawUrl) {
        engineStatus.innerText = "⚠️ کوئی آڈیو لنک نہیں ملا!";
        return;
      }

      // Build proxy URL
      let proxyUrl = rawUrl;
      let driveIdMatch = rawUrl.match(/[-\w]{25,}/);
      if (rawUrl.includes('drive.google.com') || (!rawUrl.startsWith('http') && driveIdMatch)) {
        let id = driveIdMatch ? driveIdMatch[0] : rawUrl;
        proxyUrl = `/api/stream?id=${encodeURIComponent(id)}`;
      } else if (rawUrl.startsWith('http')) {
        proxyUrl = `/api/stream?url=${encodeURIComponent(rawUrl)}`;
      }

      try {
        // Pre-fetch into RAM Blob for 100% unbreakable local looping
        engineStatus.innerText = "⚡ ہائی اسپیڈ سرور سے آڈیو منگوائی جا رہی ہے...";
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Server stream failed");
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        audio.src = blobUrl;
        engineStatus.style.color = "#4ade80";
        engineStatus.innerText = "✅ آڈیو میموری میں محفوظ ہو گئی (نان اسٹاپ لوپ تیار ہے)";
        audio.play().catch(() => {});
      } catch (e) {
        // Fallback to direct proxy stream
        audio.src = proxyUrl;
        engineStatus.innerText = "🎵 ڈائریکٹ سرور اسٹریمنگ چالو ہے";
        audio.play().catch(() => {});
      }
    }

    // Double insurance for looping
    audio.addEventListener('ended', function() {
      if (isLooping) {
        this.currentTime = 0;
        this.play().catch(() => {});
      }
    });

    function toggleLoop() {
      isLooping = !isLooping;
      audio.loop = isLooping;
      const btn = document.getElementById('loopBtn');
      btn.innerText = isLooping ? '🔁 لوپ: چالو (ON)' : '🔁 لوپ: بند (OFF)';
      btn.className = isLooping ? 'active' : '';
    }

    let speeds = [1, 1.25, 1.5, 0.75];
    let sIdx = 0;
    function changeSpeed() {
      sIdx = (sIdx + 1) % speeds.length;
      audio.playbackRate = speeds[sIdx];
      document.getElementById('spdTxt').innerText = speeds[sIdx] + 'x';
    }

    let sleepInterval = null;
    function setSleep(mins) {
      clearInterval(sleepInterval);
      const box = document.getElementById('statusBox');
      if (mins === 0) {
        box.innerText = 'سلپ ٹائمر: بند ہے';
        return;
      }
      let seconds = mins * 60;
      sleepInterval = setInterval(() => {
        seconds--;
        let m = Math.floor(seconds / 60);
        let s = seconds % 60;
        box.innerText = `سلپ ٹائمر: ${m} منٹ ${s} سیکنڈ باقی`;
        if (seconds <= 0) {
          clearInterval(sleepInterval);
          audio.pause();
          box.innerText = '⏹️ ٹائمر مکمل - آڈیو بند کر دی گئی';
        }
      }, 1000);
    }

    initAdvancedAudio();
  </script>
</body>
</html>
